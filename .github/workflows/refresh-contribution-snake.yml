name: Refresh contribution snake

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-contribution-snake.yml'

permissions:
  contents: write

concurrency:
  group: refresh-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Animate LinX's contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60a5fa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish animations to their own branch
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          publish_dir="$RUNNER_TEMP/snake-publish"
          git worktree add --detach "$publish_dir"
          if git fetch origin snake-output --depth=1; then
            git -C "$publish_dir" switch -c snake-output FETCH_HEAD
          else
            git -C "$publish_dir" switch --orphan snake-output
          fi
          cp dist/github-contribution-grid-snake*.svg "$publish_dir/"
          cd "$publish_dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-contribution-grid-snake*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh LinX contribution snake animations'
          git push origin HEAD:snake-output

name: Refresh profile statistics card

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh card with school email
        run: python scripts/update_profile_card.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/profile-details-school.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-details-school.svg
          git commit -m 'Refresh profile statistics with school email'
          git push
